[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
custom_features="hollowtide_windows"
export_filter="all_resources"
include_filter="*.json,*.dialogue"
exclude_filter="tools/*,addons/godot_ai/*,scenes/_lab/*,builds/*,icon.svg,docs/*"
export_path="builds/windows/Hollowtide.exe"
script_export_mode=2

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=false
application/icon="res://icon.png"
application/console_wrapper_icon="res://icon.png"
application/product_name="Hollowtide"
application/file_description="Hollowtide"
codesign/enable=false
ssh_remote_deploy/enabled=false
